version: 3
vars:
  KEY: "trustable"
env:
  KUBECONFIG:
    sh: test -e "$OPS_TMP/kubeconfig" && echo "$OPS_TMP/kubeconfig" || echo ~/.kube/config

tasks:
  setup:
    silent: true
    desc: setup trustable
    cmds:
      - touch _fail
      - defer: ops trustable notify
      - defer: ops trustable doctor
      - |
        CLUSTER_APIHOST="$(kubectl -n nuvolaris get cm/config -o jsonpath='{.metadata.annotations.apihost}' 2> /dev/null || true)"
        APIHOST="${CLUSTER_APIHOST:-${OPS_APIHOST:-${APIHOST:-http://miniops.me}}}"
        APIHOST="${APIHOST%/}"
        if curl -fsSL "$APIHOST/api/info" | jq -r .description | rg "OpenWhisk"
        then echo Nuvolaris running at "$APIHOST"
        else sh ops-core.sh setup mini "$APIHOST"
        fi
      - |
        if curl -sL http://localhost:11434 | rg Ollama
        then echo Ollama running
        else ops trustable ollama deploy
        fi
      - |
        CLUSTER_APIHOST="$(kubectl -n nuvolaris get cm/config -o jsonpath='{.metadata.annotations.apihost}' 2> /dev/null || true)"
        APIHOST="${CLUSTER_APIHOST:-${OPS_APIHOST:-${APIHOST:-http://miniops.me}}}"
        APIHOST="${APIHOST%/}"
        PROTO="$(printf "%s" "$APIHOST" | sed -E 's#^(https?)://.*#\1#')"
        if test "$PROTO" != "http" -a "$PROTO" != "https"; then PROTO=http; fi
        DOMAIN="$(printf "%s" "$APIHOST" | sed -E 's#^https?://##; s#/.*$##; s#:.*$##')"
        DOMAIN="${TRUSTABLE_DOMAIN:-$DOMAIN}"
        HOST="${TRUSTABLE_HOST:-trustable.$DOMAIN}"
        TRUSTABLE_URL="$PROTO://$HOST"
        if curl -fsSL "$TRUSTABLE_URL" | rg "Trustable"
        then echo Trustable running
        else ops trustable trustable deploy
        fi
      - rm -f _fail
      - task: signin

  deploy:
    silent: true
    desc: deploy trustable
    cmds:
      - task: setup

  ollama:
    desc: managing ollama

  trustable:
    desc: managing trustable

  notify:
    silent: true
    vars:
      HOSTNAME:
        sh: hostname
    cmds:
      - |
        MSG="{{.HOSTNAME}}+{{OS}}+{{ARCH}}+{{.MSG}}"
        if test -z "{{.MSG}}"
        then
          if test -e _fail
          then MSG="${MSG}+FAIL"
          else MSG="${MSG}+Success"
          fi
        fi
        curl -s "https://landing.nuvolaris.org/api/my/v1/notify?input=$MSG" > /dev/null

  signin:
    desc: signin signin
    silent: true
    cmds:
      - |
        if test -n "{{.CLI_ARGS}}"
        then bun signin.ts {{.CLI_ARGS}}
        else
          CLUSTER_APIHOST="$(kubectl -n nuvolaris get cm/config -o jsonpath='{.metadata.annotations.apihost}' 2> /dev/null || true)"
          APIHOST="${CLUSTER_APIHOST:-${OPS_APIHOST:-${APIHOST:-http://miniops.me}}}"
          APIHOST="${APIHOST%/}"
          PROTO="$(printf "%s" "$APIHOST" | sed -E 's#^(https?)://.*#\1#')"
          if test "$PROTO" != "http" -a "$PROTO" != "https"; then PROTO=http; fi
          DOMAIN="$(printf "%s" "$APIHOST" | sed -E 's#^https?://##; s#/.*$##; s#:.*$##')"
          DOMAIN="${TRUSTABLE_DOMAIN:-$DOMAIN}"
          HOST="${TRUSTABLE_HOST:-trustable.$DOMAIN}"
          bun signin.ts "$PROTO://$HOST"
        fi

  signout:
    desc: signin signin
    silent: true
    cmds:
      - docker exec -i ollama ollama signout

  update-plugin:
    desc: updating plugin
    silent: true
    cmds:
      - |
        PLUGIN_DIR="${OPS_HOME:-$HOME/.ops}/olaris-trustable"
        if test -d "$PLUGIN_DIR" && ! test -d "$PLUGIN_DIR/.git"
        then
          echo "Replacing embedded olaris-trustable copy with git plugin"
          cd "${OPS_HOME:-$HOME/.ops}"
          rm -rf "$PLUGIN_DIR"
        fi
        ops -plugin https://github.com/trustable-ai/olaris-trustable

  update-app:
    desc: update trustable app only
    silent: true
    cmds:
      - ops trustable trustable redeploy KEY="{{.KEY}}"

  update:
    desc: update plugin and trustable app
    silent: true
    cmds:
      - task: update-plugin
      - task: update-app
      - echo "Trustable updated"

  redeploy:
    desc: redeploy trustable and ollama
    cmds:
      - ops trustable ollama redeploy
      - ops trustable trustable redeploy KEY="{{.KEY}}"
    silent: false

  remove-all:
    - |
      {{if eq OS "windows"}}
      cmd /c start "" cmd /c 'timeout /t 2 & cd %HOMEDRIVE%%HOMEPATH% & .local\bin\ops.exe -reset force & del .local\bin\ops.exe & del .local\bin\ops'
      {{else}}
      cd ~
      ops -reset force ;
      /bin/rm -f ~/.local/bin/ops ;
      sudo /bin/rm -Rf ~/.ops
      {{end}}

  uninstall:
    prompt: "Are you sure you want to uninstall (your code is still in .ops-workspace under the home)"
    desc: uninstalling
    silent: true
    ignore_error: true
    cmds:
      - ops trustable ollama undeploy
      - sh ops-core.sh setup docker delete
      - task: remove-all

  clean:
    prompt: "Are you sure you want to clean all (your code is still in .ops-workspace under the home)"
    cmds:
      - sh ops-core.sh setup docker clean-all
  logs:
    desc: trustable logs
    silent: true
    cmds:
      - kubectl -n nuvolaris logs trustable-0 -f

  doctor:
    desc: run diagnostics and optionally file a report
    silent: true
    cmds:
      - bun doctor.ts

  restart:
    desc: restart the cluster and ollama
    silent: true
    cmds:
      - docker restart ollama
      - docker restart nuvolaris-control-plane
      - sh ops-core.sh setup kubernetes post-deploy
      - task: doctor
