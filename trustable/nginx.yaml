---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustable-ing
  annotations:
$H    nginx.ingress.kubernetes.io/ssl-redirect: "false"
$H    nginx.ingress.kubernetes.io/proxy-buffering: "off"
$H    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
$H    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
$H    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
$T    cert-manager.io/cluster-issuer: letsencrypt-prod
$T    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: $TRUSTABLE_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trustable-svc
                port:
                  number: 8910
$T  tls:
$T    - hosts:
$T        - $TRUSTABLE_HOST
$T      secretName: trustable-tls
